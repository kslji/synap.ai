<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Synap.surf</title>
    <script src="./theme-boot.js"></script>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    />
  </head>
  <body>
    <div id="root">
      <!-- Static first-paint splash, replaced when React mounts. Matches the fixed light identity. -->
      <div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#F2F2F7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
        <div style="width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#FB923C,#F97316);display:flex;align-items:center;justify-content:center;color:#ffffff;font-size:26px;font-weight:900;">S</div>
        <div style="width:112px;height:4px;border-radius:999px;background:#E7E7F0;overflow:hidden;">
          <div style="width:50%;height:100%;border-radius:999px;background:#F97316;animation:splash-pulse 1.1s ease-in-out infinite;"></div>
        </div>
        <p style="margin:0;font-size:13px;color:#5B5B6B;">Starting Synap.surf</p>
      </div>
      <style>@keyframes splash-pulse{0%,100%{transform:translateX(0)}50%{transform:translateX(100%)}}</style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
