# Tag v* builds the installers and publishes a GitHub Release.
# v1.2.3-beta.1 is a prerelease. Signing secrets stay empty until docs/RELEASE.md says otherwise.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  model-eval-full:
    needs: checks
    uses: ./.github/workflows/model-eval-full.yml
    with:
      release_gate: true

  installers:
    needs: [checks, model-eval-full]
    uses: ./.github/workflows/installers.yml
    secrets: inherit

  # Separate from the pull-request installers. The 2B file is about 1.3 GB.
  offline-installers:
    needs: [checks, model-eval-full]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: installer-offline-macos
            dist: dist:mac
          - os: windows-latest
            artifact: installer-offline-windows
            dist: dist:win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            fi
            echo "npm ci failed (attempt ${attempt})"
            rm -rf node_modules
          done
          exit 1
      - name: Fetch llama.cpp and OCR data
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "macOS" ]; then
            node scripts/fetch-sidecars.mjs --platform=darwin --arch=arm64
            node scripts/fetch-sidecars.mjs --platform=darwin --arch=x64
          else
            node scripts/fetch-sidecars.mjs
          fi
          node scripts/fetch-tessdata.mjs
      - name: Download the bundled 2B model
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/surf-bundle" "$RUNNER_TEMP/surf-marker"
          node scripts/fetch-setup-model.mjs "$RUNNER_TEMP/surf-bundle"
          printf '%s\n' '{"model":"qwen3.5-2b-q4_k_m","bundled":true}' > "$RUNNER_TEMP/surf-marker/setup-model.json"
      - name: Build the offline installer
        shell: bash
        run: npm run ${{ matrix.dist }} -w @surf/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          SURF_BUNDLE_MODEL: "1"
          SURF_BUNDLE_MODEL_DIR: ${{ runner.temp }}/surf-bundle
          SURF_SETUP_MARKER: ${{ runner.temp }}/surf-marker/setup-model.json
      - name: Reject an installer that is not under 2 GiB
        working-directory: apps/desktop
        shell: bash
        run: node scripts/check-installer-size.mjs dist
        env:
          SURF_BUNDLE_MODEL: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            apps/desktop/dist/*-offline-2b.dmg
            apps/desktop/dist/*-offline-2b.exe
          if-no-files-found: error

  publish:
    needs: [installers, offline-installers]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: installer-*
          merge-multiple: true
      - name: SHA256SUMS
        run: |
          cd release
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum | tee SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') }}
          generate_release_notes: true
          files: release/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
