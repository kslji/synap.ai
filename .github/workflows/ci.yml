name: CI

on:
  pull_request:
  push:

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Compiler tools for native prebuilds
        run: sudo apt-get update && sudo apt-get install -y make g++
      - run: npm ci
      - name: Fetch llama.cpp sidecar for this OS
        working-directory: apps/desktop
        run: node scripts/fetch-sidecars.mjs
      - name: Fetch OCR language data
        working-directory: apps/desktop
        run: node scripts/fetch-tessdata.mjs
      - name: Document index unit tests
        run: npm run test:unit -w @surf/desktop
      - name: Typecheck and build the desktop app
        run: npm run build -w @surf/desktop

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck and build the website
        run: npm run build -w @surf/web
      - name: Website link check
        run: |
          npx tsx --test apps/web/src/site.test.ts
          node apps/web/scripts/check-dist.mjs

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install search API
        run: python -m pip install -r services/api/requirements.txt -r services/api/requirements-dev.txt
      - name: Search API tests
        working-directory: services/api
        run: python -m pytest
      - name: Alembic head
        working-directory: services/api
        run: python -m alembic heads
      - name: Compose config
        run: |
          cp deploy/.env.example deploy/.env
          docker compose --env-file deploy/.env.example -f deploy/docker-compose.yml config >/dev/null

  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install auth host
        run: python -m pip install -r apps/host/requirements.txt
      - name: Unit checks
        run: ./scripts/check.sh

  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compiler tools, Electron libraries, and a display
        run: sudo apt-get update && sudo apt-get install -y make g++ xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 libpango-1.0-0 libcairo2 libx11-xcb1 libxss1
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .surf-models
          key: surf-models-qwen2b-embeddinggemma-v1
      - name: Fetch llama.cpp sidecar for this OS
        working-directory: apps/desktop
        run: node scripts/fetch-sidecars.mjs
      - name: Eval dependencies
        run: python -m pip install -r harness/requirements.txt
      - name: Quick eval
        env:
          SURF_MODELS_DIR: ${{ github.workspace }}/.surf-models
          SURF_ELECTRON_ARGS: "--no-sandbox"
          DISPLAY: ":1"
        run: |
          Xvfb :1 -screen 0 1280x800x24 >/tmp/xvfb.log 2>&1 &
          ./harness/run.sh quick
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: harness/reports/
