name: check

on:
  push:
  pull_request:

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install auth host
        run: python -m pip install -r apps/host/requirements.txt
      - name: Unit checks
        run: ./scripts/check.sh
