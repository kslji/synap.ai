# Tag v* builds the installers and publishes a GitHub Release.
# v1.2.3-beta.1 is a prerelease. Signing secrets stay empty until docs/RELEASE.md says otherwise.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  installers:
    uses: ./.github/workflows/installers.yml
    secrets: inherit

  publish:
    needs: installers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: installer-*
          merge-multiple: true
      - name: SHA256SUMS
        run: |
          cd release
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum | tee SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') }}
          generate_release_notes: true
          files: release/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
