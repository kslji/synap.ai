# electron-builder 26.15.3 - verified on Linux (AppImage) 9 Oct 2026; mac/win sections need a Mac / Windows runner.
appId: ai.surf.desktop
productName: Surf AI
executableName: SurfAI
artifactName: SurfAI-${version}-${arch}.${ext}
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
  - "!**/*.map"
asar: true
asarUnpack:
  - "**/*.node"                      # better-sqlite3-multiple-ciphers prebuilt Node-API addon
  - "node_modules/sqlite-vec-*/**"   # vec0.so/.dylib/.dll must be a real file for loadExtension()
extraResources:
  - from: resources/bin/${platform}-${arch}   # llama-server + libs (scripts/fetch-sidecars.mjs fills these)
    to: bin
  - from: resources/models.registry.json
    to: models.registry.json
# Node-API prebuilds (bsmc) work in Electron as-is; rebuilding would need a C++ toolchain for nothing.
npmRebuild: false

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip                    # needed by electron-updater on macOS (latest-mac.yml)
      arch: [arm64, x64]
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false                    # post-MVP: true + APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false                  # per-user install, no admin, auto-update works
  allowToChangeInstallationDirectory: true
linux:
  target: [AppImage]
  category: Utility

# TODO(signing, Day 7): macOS notarisation needs APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID.
# Windows Authenticode needs CSC_LINK / CSC_KEY_PASSWORD. Unsigned builds warn in Gatekeeper and SmartScreen.
publish:
  provider: github
  owner: kslji
  repo: synap.ai
  releaseType: draft
