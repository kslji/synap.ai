name: "Surf AI CodeQL config"

# Disable default queries that might not apply to our codebase
# We only want security-focused queries
queries:
  - uses: security-extended

paths:
  - apps
  - packages
  - services
  - scripts

paths-ignore:
  - node_modules
  - '**/node_modules'
  - '**/*.test.*'
  - '**/*.spec.*'
  - 'docs/code-samples'
  - 'harness'
  - 'apps/desktop/out'
  - 'apps/web/dist'
  - 'apps/web/.next'
  - 'services/api/.venv'
